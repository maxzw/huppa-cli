[project]
name = "huppa-cli"
dynamic = ["version"]
description = "CLI tool and MCP server for Huppa gym class booking"
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{name = "dev"}]
dependencies = [
    "mcp>=1.6,<2.0",
    "requests>=2.32,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
    "keyring>=25.0,<26.0",
    "click>=8.1,<9.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=8.3,<9.0",
    "mypy>=1.15,<2.0",
    "types-requests>=2.32.0.20240914,<3.0",
]

[project.scripts]
huppa = "huppa_cli.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/huppa_cli"]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.11"
files = ["src/huppa_cli"]
ignore_missing_imports = true
warn_unused_ignores = true
