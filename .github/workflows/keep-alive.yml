name: Keep alive

on:
  schedule:
    - cron: "0 2 1 * *"  # Monthly: 1st @ 02:00 UTC
  workflow_dispatch: {}

jobs:
  touch:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.KEEPALIVE_APP_ID }}
          private-key: ${{ secrets.KEEPALIVE_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Update keep-alive timestamp
        run: |
          mkdir -p .github
          date -u > .github/.keep-alive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/.keep-alive
          git diff-index --quiet HEAD || git commit -m "chore: keep-alive [skip ci]"
          git push
